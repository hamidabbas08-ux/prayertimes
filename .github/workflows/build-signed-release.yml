name: Build Signed APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    name: Signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/prayer-times-upload-key.jks

          chmod 600 android/app/prayer-times-upload-key.jks

          test -s android/app/prayer-times-upload-key.jks || {
            echo "ERROR: Keystore file was not created."
            exit 1
          }

      - name: Create signing properties
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || \
             [ -z "$KEY_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: One or more signing secrets are empty."
            exit 1
          fi

          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=prayer-times-upload-key.jks\n'
          } > android/key.properties

          chmod 600 android/key.properties

      - name: Analyze project
        run: flutter analyze

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed release AAB
        run: flutter build appbundle --release

      - name: Verify release files
        shell: bash
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk || {
            echo "ERROR: Signed APK was not found."
            exit 1
          }

          test -f build/app/outputs/bundle/release/app-release.aab || {
            echo "ERROR: Signed AAB was not found."
            exit 1
          }

          echo "===== RELEASE FILES ====="
          ls -lh \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab

      - name: Verify Azan audio inside APK and AAB
        shell: bash
        run: |
          echo "===== APK AZAN RESOURCES ====="
          unzip -l build/app/outputs/flutter-apk/app-release.apk             | grep -E 'res/raw/azan_(normal|fajr)\.mp3'             | tee /tmp/apk-azan-resources.txt

          grep -q 'azan_normal.mp3' /tmp/apk-azan-resources.txt || {
            echo "ERROR: azan_normal.mp3 is missing from signed APK."
            exit 1
          }

          grep -q 'azan_fajr.mp3' /tmp/apk-azan-resources.txt || {
            echo "ERROR: azan_fajr.mp3 is missing from signed APK."
            exit 1
          }

          echo "===== AAB AZAN RESOURCES ====="
          unzip -l build/app/outputs/bundle/release/app-release.aab             | grep -E 'base/res/raw/azan_(normal|fajr)\.mp3'             | tee /tmp/aab-azan-resources.txt

          grep -q 'azan_normal.mp3' /tmp/aab-azan-resources.txt || {
            echo "ERROR: azan_normal.mp3 is missing from signed AAB."
            exit 1
          }

          grep -q 'azan_fajr.mp3' /tmp/aab-azan-resources.txt || {
            echo "ERROR: azan_fajr.mp3 is missing from signed AAB."
            exit 1
          }

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-signed-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
